<!doctype html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Liste des entreprises</title>
    <style>
        body{font-family:Arial,Helvetica,sans-serif;background:#f7f9fc;margin:0;padding:20px;color:#111}
        .box{max-width:800px;margin:0 auto;background:#fff;padding:16px;border-radius:8px;box-shadow:0 6px 18px rgba(0,0,0,0.06)}
        h1{margin:0 0 12px 0;font-size:1.25rem}
        ul{padding-left:0;margin:8px 0;list-style:none}
        li{margin:6px 0;padding:8px 10px;border-bottom:1px solid #eef2f7;display:flex;justify-content:space-between;align-items:center}
        .muted{color:#6b7280;font-size:0.95rem}
        .empty{color:#6b7280;padding:12px;text-align:center}

        /* boutons */
        .btn{
            display:inline-block;
            padding:6px 10px;
            border-radius:6px;
            text-decoration:none;
            color:#fff;
            background:#2563eb;
            font-size:0.9rem;
            border:none;
            cursor:pointer;
        }

        .btn-delete {
            background:#ef4444; /* rouge */
        }
        .btn-delete:hover {
            background:#dc2626;
        }

        .btn-add {
            background:#10b981; /* vert */
        }
        .btn-add:hover {
            background:#0e9e6e;
        }

        /* champ de recherche */
        .search-box {
            display:flex;
            align-items:center;
            gap:8px;
            margin-bottom:12px;
        }
        .search-box input {
            flex:1;
            padding:6px 8px;
            border:1px solid #ddd;
            border-radius:6px;
            font-size:0.95rem;
        }

        /* modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        .modal.active {
            display: flex;
        }
        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 8px;
            width: 90%;
            max-width: 600px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }
        .modal-header {
            margin-bottom: 20px;
        }
        .modal-header h2 {
            margin: 0;
            font-size: 1.5em;
        }
        .modal-close {
            position: absolute;
            top: 10px;
            right: 15px;
            background: none;
            border: none;
            font-size: 28px;
            cursor: pointer;
            color: #666;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        .form-group textarea {
            width: 100%;
            min-height: 150px;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-family: monospace;
            font-size: 0.9em;
        }
        .form-group input[type="file"] {
            padding: 6px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            border-bottom: 2px solid #eee;
        }
        .tab-btn {
            padding: 8px 15px;
            border: none;
            background: none;
            cursor: pointer;
            font-weight: bold;
            color: #666;
            border-bottom: 3px solid transparent;
        }
        .tab-btn.active {
            color: #2563eb;
            border-bottom-color: #2563eb;
        }
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }
        .error-msg {
            color: #ef4444;
            margin-top: 10px;
            padding: 10px;
            background: #fef2f2;
            border-radius: 4px;
            display: none;
        }
        .success-msg {
            color: #10b981;
            margin-top: 10px;
            padding: 10px;
            background: #f0fdf4;
            border-radius: 4px;
            display: none;
        }

        /* bouton flottant vers l'accueil */
        .home-btn{
            position:fixed;
            right:20px;
            bottom:20px;
            z-index:999;
            display:inline-flex;
            align-items:center;
            gap:8px;
            padding:10px 14px;
            background:#10b981;
            color:#fff;
            text-decoration:none;
            border-radius:999px;
            box-shadow:0 8px 24px rgba(16,185,129,0.18);
            font-weight:700;
            font-size:0.95rem;
        }
        .home-btn:hover{background:#0ea96f}
        .home-btn:focus{outline:2px solid rgba(16,185,129,0.25);outline-offset:4px}
        .home-icon{width:16px;height:16px;display:inline-block;flex:0 0 16px}
    </style>
</head>
<body>
<div class="box">
    <h1>Entreprises</h1>

    <div class="search-box">
        <input type="text" id="searchInput" placeholder="Rechercher une entreprise...">
        <button class="btn btn-add" onclick="openAddModal()">Ajouter</button>
    </div>

    <div id="list">
        <div class="empty">Chargement...</div>
    </div>
</div>

<!-- Modal Ajouter -->
<div id="addModal" class="modal">
    <div class="modal-content">
        <button class="modal-close" onclick="closeAddModal()">&times;</button>
        <div class="modal-header">
            <h2>Ajouter une entreprise</h2>
        </div>

        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('text')">Texte JSON</button>
            <button class="tab-btn" onclick="switchTab('file')">Fichier JSON</button>
        </div>

        <div id="text-tab" class="tab-content active">
            <div class="form-group">
                <label for="jsonText">Collez le JSON :</label>
                <textarea id="jsonText" placeholder='{"idEntreprise": "ent123", "nomEntreprise": "Entreprise XYZ"}'></textarea>
            </div>
            <button class="btn btn-add" onclick="addFromText()">Ajouter depuis le texte</button>
        </div>

        <div id="file-tab" class="tab-content">
            <div class="form-group">
                <label for="jsonFile">Sélectionnez un fichier JSON :</label>
                <input type="file" id="jsonFile" accept=".json">
            </div>
            <button class="btn btn-add" onclick="addFromFile()">Ajouter depuis le fichier</button>
        </div>

        <div id="errorMsg" class="error-msg"></div>
        <div id="successMsg" class="success-msg"></div>
    </div>
</div>

<!-- Bouton accueil -->
<a href="/" class="home-btn" aria-label="Aller à l'accueil">
    <span class="home-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="16" height="16" xmlns="http://www.w3.org/2000/svg">
            <path d="M3 9.5L12 3l9 6.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1V9.5z"/>
        </svg>
    </span>
    Accueil
</a>

<script>
    let allCompanies = [];

    // 🔹 Récupération de la liste
    fetch('/api/companies')
        .then(r => r.ok ? r.json() : Promise.reject('Erreur serveur'))
        .then(companies => {
            allCompanies = companies || [];
            renderList(allCompanies);
        })
        .catch(() => {
            document.getElementById('list').innerHTML = '<div class="empty">Impossible de charger la liste</div>';
        });

    // 🔹 Fonction d'affichage de la liste
    function renderList(companies) {
        const container = document.getElementById('list');
        if (!companies || companies.length === 0) {
            container.innerHTML = '<div class="empty">Aucune entreprise</div>';
            return;
        }

        let html = '<ul>';
        companies.forEach(c => {
            html += `
      <li>
        <span>${c.name}</span>
        <a href="#" class="btn btn-delete" onclick="deleteCompany(${c.id});return false;">Supprimer</a>
      </li>`;
        });
        html += '</ul>';
        container.innerHTML = html;
    }

    // 🔹 Recherche dynamique
    document.getElementById('searchInput').addEventListener('input', function() {
        const q = this.value.toLowerCase().trim();
        const filtered = allCompanies.filter(c => c.name.toLowerCase().includes(q));
        renderList(filtered);
    });

    // 🔹 Suppression d'une entreprise
    async function deleteCompany(id) {
        if (!confirm("Voulez-vous vraiment supprimer cette entreprise ?")) return;
        try {
            const res = await fetch(`/api/${id}`, { method: 'DELETE' });
            if (!res.ok) throw new Error('Erreur serveur');
            allCompanies = allCompanies.filter(c => c.id !== id);
            renderList(allCompanies);
            alert("Entreprise supprimée !");
        } catch (err) {
            alert("Erreur: " + err.message);
        }
    }

    // 🔹 Gestion du modal
    function openAddModal() {
        document.getElementById('addModal').classList.add('active');
        clearMessages();
    }

    function closeAddModal() {
        document.getElementById('addModal').classList.remove('active');
        document.getElementById('jsonText').value = '';
        document.getElementById('jsonFile').value = '';
        clearMessages();
    }

    function switchTab(tab) {
        document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
        document.getElementById(tab + '-tab').classList.add('active');
        event.target.classList.add('active');
    }

    function clearMessages() {
        document.getElementById('errorMsg').style.display = 'none';
        document.getElementById('successMsg').style.display = 'none';
        document.getElementById('errorMsg').textContent = '';
        document.getElementById('successMsg').textContent = '';
    }

    function showError(msg) {
        clearMessages();
        document.getElementById('errorMsg').textContent = msg;
        document.getElementById('errorMsg').style.display = 'block';
    }

    function showSuccess(msg) {
        clearMessages();
        document.getElementById('successMsg').textContent = msg;
        document.getElementById('successMsg').style.display = 'block';
    }

    // 🔹 Validation du JSON
    function validateCompanyJSON(data) {
        if (!data || typeof data !== 'object') {
            throw new Error('Le JSON doit être un objet');
        }
        if (!data.idEntreprise || typeof data.idEntreprise !== 'string') {
            throw new Error('Le champ "idEntreprise" est obligatoire et doit être une chaîne de caractères');
        }
        if (!data.nomEntreprise || typeof data.nomEntreprise !== 'string') {
            throw new Error('Le champ "nomEntreprise" est obligatoire et doit être une chaîne de caractères');
        }
        return true;
    }

    // 🔹 Ajouter depuis texte
    async function addFromText() {
        const jsonText = document.getElementById('jsonText').value.trim();
        if (!jsonText) {
            showError('Veuillez coller un JSON valide');
            return;
        }

        try {
            const data = JSON.parse(jsonText);
            validateCompanyJSON(data);
            await submitCompany(data);
        } catch (err) {
            showError('Erreur de syntaxe JSON : ' + err.message);
        }
    }

    // 🔹 Ajouter depuis fichier
    async function addFromFile() {
        const fileInput = document.getElementById('jsonFile');
        if (!fileInput.files[0]) {
            showError('Veuillez sélectionner un fichier JSON');
            return;
        }

        const file = fileInput.files[0];
        const reader = new FileReader();

        reader.onload = async function(e) {
            try {
                const data = JSON.parse(e.target.result);
                validateCompanyJSON(data);
                await submitCompany(data);
            } catch (err) {
                showError('Erreur de lecture du fichier JSON : ' + err.message);
            }
        };

        reader.onerror = function() {
            showError('Impossible de lire le fichier');
        };

        reader.readAsText(file);
    }

    // 🔹 Soumettre l'entreprise
    async function submitCompany(data) {
        try {
            const res = await fetch('/api/companies', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name: data.nomEntreprise })
            });

            if (!res.ok) throw new Error('Erreur serveur lors de l\'ajout');

            const newCompany = await res.json();
            allCompanies.push(newCompany);
            renderList(allCompanies);

            showSuccess(`Entreprise "${data.nomEntreprise}" ajoutée avec succès !`);
            setTimeout(() => closeAddModal(), 1500);
        } catch (err) {
            showError('Erreur : ' + err.message);
        }
    }

    // Fermer le modal en cliquant en dehors
    document.getElementById('addModal').addEventListener('click', function(e) {
        if (e.target === this) closeAddModal();
    });
</script>
</body>
</html>
